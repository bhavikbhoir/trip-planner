<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Manifest — AI Trip Planner for Group Travel</title>
    <meta
      name="description"
      content="Manifest is an AI trip planner built for groups. It drafts the itinerary, everyone suggests and approves changes, and the group tracks bookings and expenses together — no more group chat spiral."
    />
    <link rel="canonical" href="https://trip-planner-manifest.web.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trip-planner-manifest.web.app/" />
    <meta property="og:site_name" content="Manifest" />
    <meta property="og:title" content="Manifest — AI Trip Planner for Group Travel" />
    <meta
      property="og:description"
      content="Manifest is an AI trip planner built for groups. It drafts the itinerary, everyone suggests and approves changes, and the group tracks bookings and expenses together."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Manifest — AI Trip Planner for Group Travel" />
    <meta
      name="twitter:description"
      content="Manifest is an AI trip planner built for groups. It drafts the itinerary, everyone suggests and approves changes, and the group tracks bookings and expenses together."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Manifest",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "url": "https://trip-planner-manifest.web.app/",
        "description": "Manifest is an AI trip planner built for groups. It drafts the itinerary, everyone suggests and approves changes, and the group tracks bookings and expenses together.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      // Applied before anything renders so a stored theme override doesn't
      // flash the wrong palette for a frame — see src/utils/theme.js.
      (function () {
        var t = localStorage.getItem('manifest-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
