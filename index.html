<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MANIFEST — Trip Planner</title>
    <meta
      name="description"
      content="Manifest turns a group chat spiral into one shared trip plan — AI drafts the itinerary, everyone suggests and approves changes, together."
    />
    <link rel="canonical" href="https://trip-planner-manifest.web.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trip-planner-manifest.web.app/" />
    <meta property="og:site_name" content="Manifest" />
    <meta property="og:title" content="Manifest — Plan the trip. Actually agree on it." />
    <meta
      property="og:description"
      content="Manifest turns a group chat spiral into one shared trip plan — AI drafts the itinerary, everyone suggests and approves changes, together."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Manifest — Plan the trip. Actually agree on it." />
    <meta
      name="twitter:description"
      content="Manifest turns a group chat spiral into one shared trip plan — AI drafts the itinerary, everyone suggests and approves changes, together."
    />
    <script>
      // Applied before anything renders so a stored theme override doesn't
      // flash the wrong palette for a frame — see src/utils/theme.js.
      (function () {
        var t = localStorage.getItem('manifest-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
